<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebanon NH Assessment Data</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .info h4 {
            margin: 0 0 5px;
            color: #777;
        }
        .legend {
            line-height: 18px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .leaflet-control-settings {
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            cursor: pointer;
        }
        .leaflet-control-settings a {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #333;
            font-size: 18px;
        }
        .leaflet-control-settings a:hover {
            background-color: #f4f4f4;
        }
        .settings-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 1001;
            max-width: 320px;
            display: none;
        }
        .settings-panel.visible {
            display: block;
        }
        .settings-panel h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-panel .close-btn {
            cursor: pointer;
            font-size: 20px;
            color: #999;
            background: none;
            border: none;
            padding: 0;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
        }
        .settings-panel .close-btn:hover {
            color: #333;
        }
        .settings-panel label {
            display: block;
            margin: 8px 0;
            font-size: 12px;
            line-height: 1.4;
        }
        .settings-panel input[type="checkbox"] {
            margin-right: 5px;
        }
        .settings-panel button {
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
        .settings-panel button:hover {
            background-color: #45a049;
        }
        .settings-panel button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .settings-panel .help-text {
            font-size: 11px;
            color: #666;
            margin: 10px 0;
            line-height: 1.4;
        }
        .settings-panel .stats {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 11px;
            color: #666;
        }
        .settings-section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .settings-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .settings-section h5 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }
        .search-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 400px;
            max-width: calc(100% - 20px);
        }
        .search-box {
            position: relative;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .search-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
        }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 5px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        .search-results.visible {
            display: block;
        }
        .search-results-header {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f9f9f9;
            border-radius: 5px 5px 0 0;
        }
        .search-results-header h4 {
            margin: 0;
            font-size: 13px;
            color: #333;
        }
        .search-results-close {
            cursor: pointer;
            font-size: 18px;
            color: #999;
            background: none;
            border: none;
            padding: 0;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
        }
        .search-results-close:hover {
            color: #333;
        }
        .search-result-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .search-result-item:hover {
            background-color: #f5f5f5;
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-address {
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }
        .search-result-details {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }
        .search-no-results {
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading parcel data...</div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Search for property address...">
            <span class="search-icon">🔍</span>
        </div>
        <div id="search-results" class="search-results">
            <div class="search-results-header">
                <h4 id="search-results-count">0 results</h4>
                <button class="search-results-close" onclick="closeSearchResults()">&times;</button>
            </div>
            <div id="search-results-list"></div>
        </div>
    </div>

    <div id="settings-panel" class="settings-panel">
        <h4>
            <span>Map Settings</span>
            <button class="close-btn" onclick="toggleSettings()">&times;</button>
        </h4>

        <div class="settings-section">
            <h5>Geocoding Sources</h5>
            <p class="help-text">Select which geocoding services to use. Multiple sources will try each in order until coordinates are found.</p>
            <div id="source-checkboxes"></div>
            <button id="reload-btn" onclick="reloadWithSources()">Load Data</button>
        </div>

        <div id="stats" class="stats" style="display: none;"></div>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <script>
        // Initialize map centered on Lebanon, NH
        const map = L.map('map').setView([43.6422, -72.2517], 13);

        // Add OpenStreetMap tile layer (street map)
        const streetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // Layer groups
        const parcelMarkers = L.layerGroup().addTo(map);
        let heatmapLayer = null;

        // Add layer control
        const baseMaps = {
            "Street Map": streetMap
        };

        const overlayMaps = {
            "Parcel Markers": parcelMarkers
        };

        const layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

        // Add settings control
        L.Control.Settings = L.Control.extend({
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-settings');
                const link = L.DomUtil.create('a', '', container);
                link.href = '#';
                link.title = 'Settings';
                link.innerHTML = '⚙️';

                L.DomEvent.on(link, 'click', function(e) {
                    L.DomEvent.preventDefault(e);
                    toggleSettings();
                });

                return container;
            }
        });

        L.control.settings = function(opts) {
            return new L.Control.Settings(opts);
        };

        L.control.settings({ position: 'topleft' }).addTo(map);

        // Toggle settings panel
        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('visible');
        }

        // ============================================================================
        // Property Search Functionality
        // ============================================================================

        let allParcelsData = [];  // Store all loaded parcels for searching
        let parcelMarkersMap = {};  // Map parcel PIDs to their markers

        // Search for properties
        function searchProperties() {
            const searchInput = document.getElementById('search-input');
            const searchTerm = searchInput.value.trim().toLowerCase();

            if (searchTerm.length === 0) {
                closeSearchResults();
                return;
            }

            // Search through all parcels (case-insensitive)
            const results = allParcelsData.filter(parcel => {
                const address = (parcel.location || '').toLowerCase();
                return address.includes(searchTerm);
            });

            displaySearchResults(results, searchTerm);
        }

        // Display search results
        function displaySearchResults(results, searchTerm) {
            const resultsContainer = document.getElementById('search-results');
            const resultsList = document.getElementById('search-results-list');
            const resultsCount = document.getElementById('search-results-count');

            // Clear previous results
            resultsList.innerHTML = '';

            // Update count
            resultsCount.textContent = `${results.length} result${results.length !== 1 ? 's' : ''}`;

            if (results.length === 0) {
                resultsList.innerHTML = '<div class="search-no-results">No properties found matching "' + searchTerm + '"</div>';
            } else {
                // Display each result
                results.forEach(parcel => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.onclick = () => selectParcel(parcel);

                    const address = document.createElement('div');
                    address.className = 'search-result-address';
                    address.textContent = parcel.location;

                    const details = document.createElement('div');
                    details.className = 'search-result-details';
                    details.textContent = `PID: ${parcel.pid} | ${parcel.property_type} | Change: ${parcel.pct_change}%`;

                    item.appendChild(address);
                    item.appendChild(details);
                    resultsList.appendChild(item);
                });
            }

            // Show results
            resultsContainer.classList.add('visible');
        }

        // Close search results
        function closeSearchResults() {
            const resultsContainer = document.getElementById('search-results');
            resultsContainer.classList.remove('visible');
        }

        // Select a parcel from search results
        function selectParcel(parcel) {
            if (!parcel.lat || !parcel.lon) {
                alert('This property does not have location coordinates.');
                return;
            }

            // Close search results
            closeSearchResults();

            // Zoom to the parcel
            map.setView([parcel.lat, parcel.lon], 18);

            // Open the marker popup
            const marker = parcelMarkersMap[parcel.pid];
            if (marker) {
                marker.openPopup();
            }
        }

        // Set up search input listener
        document.getElementById('search-input').addEventListener('input', function(e) {
            searchProperties();
        });

        // Close search results when clicking outside
        document.addEventListener('click', function(e) {
            const searchContainer = document.querySelector('.search-container');
            const settingsPanel = document.getElementById('settings-panel');

            if (!searchContainer.contains(e.target) && !settingsPanel.contains(e.target)) {
                // Clicked outside search and settings, close search results
                const resultsContainer = document.getElementById('search-results');
                if (resultsContainer.classList.contains('visible')) {
                    closeSearchResults();
                }
            }
        });

        // Add legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = '<h4>Assessment Change 2024-2025</h4>';
            const grades = [-10, 0, 10, 20, 30, 40];
            const colors = ['#0000ff', '#00ffff', '#00ff00', '#ffff00', '#ff8800', '#ff0000'];

            for (let i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + colors[i] + '"></i> ' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '%<br>' : '+%');
            }
            return div;
        };
        legend.addTo(map);

        // Function to get color based on percentage change
        function getColor(pctChange) {
            return pctChange > 40 ? '#ff0000' :
                   pctChange > 30 ? '#ff8800' :
                   pctChange > 20 ? '#ffff00' :
                   pctChange > 10 ? '#00ff00' :
                   pctChange > 0  ? '#00ffff' :
                                    '#0000ff';
        }

        // Available geocoders and descriptions
        let availableGeocoders = {};

        // Load available geocoders
        fetch('/api/geocoders')
            .then(response => response.json())
            .then(data => {
                availableGeocoders = data;
                const checkboxContainer = document.getElementById('source-checkboxes');

                // Create checkboxes for each geocoder
                data.available.forEach((source, index) => {
                    const label = document.createElement('label');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = source;
                    checkbox.id = `source-${source}`;
                    // Default: check legacy and census for best coverage (both cache-only)
                    checkbox.checked = (source === 'legacy' || source === 'census');

                    const description = data.descriptions[source] || source;
                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(` ${source}: ${description}`));
                    checkboxContainer.appendChild(label);
                });

                // Load data with default sources
                loadParcels();
            })
            .catch(error => {
                console.error('Error loading geocoders:', error);
                // Fallback to nominatim only
                loadParcels('nominatim');
            });

        function getSelectedSources() {
            const checkboxes = document.querySelectorAll('#source-checkboxes input[type="checkbox"]:checked');
            const sources = Array.from(checkboxes).map(cb => cb.value);
            return sources.length > 0 ? sources : ['nominatim'];
        }

        function reloadWithSources() {
            // Clear existing markers and heatmap
            parcelMarkers.clearLayers();
            if (heatmapLayer && map.hasLayer(heatmapLayer)) {
                map.removeLayer(heatmapLayer);
            }

            // Reset stats
            document.getElementById('stats').style.display = 'none';
            document.getElementById('stats').innerHTML = '';

            // Reload data
            loadParcels();
        }

        function loadParcels() {
            const sources = getSelectedSources();
            const sourcesParam = sources.join(',');

            document.getElementById('loading').style.display = 'block';
            document.getElementById('reload-btn').disabled = true;

            fetch(`/api/parcels?sources=${sourcesParam}`)
                .then(response => response.json())
                .then(parcels => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('reload-btn').disabled = false;

                    // Store all parcels for search functionality
                    allParcelsData = parcels;
                    parcelMarkersMap = {};  // Reset marker map

                    // Prepare data for heatmap
                    const heatData = [];

                    // Count parcels by source
                    const sourceStats = {};

                    // Add parcel markers
                    parcels.forEach(parcel => {
                        if (parcel.lat && parcel.lon) {
                            // Track source statistics
                            const source = parcel.geocode_source || 'unknown';
                            sourceStats[source] = (sourceStats[source] || 0) + 1;

                            // Create marker
                            const marker = L.circleMarker([parcel.lat, parcel.lon], {
                                radius: 6,
                                fillColor: getColor(parcel.pct_change),
                                color: '#000',
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.8
                            });

                            // Create popup content
                            const popupContent = `
                                <strong>PID:</strong> ${parcel.pid}<br>
                                <strong>Location:</strong> ${parcel.location}<br>
                                <strong>Type:</strong> ${parcel.property_type}<br>
                                <strong>Assessment 2025:</strong> ${parcel.assessment_2025}<br>
                                <strong>Assessment 2024:</strong> ${parcel.assessment_2024}<br>
                                <strong>Change:</strong> ${parcel.pct_change}%<br>
                                <strong>Geocode Source:</strong> ${source}
                            `;

                            marker.bindPopup(popupContent);
                            marker.addTo(parcelMarkers);

                            // Store marker reference for search functionality
                            parcelMarkersMap[parcel.pid] = marker;

                            // Add to heatmap data (use intensity based on absolute percent change)
                            heatData.push([parcel.lat, parcel.lon, Math.abs(parcel.pct_change) / 100]);
                        }
                    });

                    // Create heatmap layer
                    heatmapLayer = L.heatLayer(heatData, {
                        radius: 25,
                        blur: 15,
                        maxZoom: 17,
                        max: 0.5,
                        gradient: {
                            0.0: 'blue',
                            0.2: 'cyan',
                            0.4: 'lime',
                            0.6: 'yellow',
                            0.8: 'orange',
                            1.0: 'red'
                        }
                    });

                    // Add heatmap to layer control
                    overlayMaps['Assessment Change Heatmap'] = heatmapLayer;
                    layerControl.remove();
                    L.control.layers(baseMaps, overlayMaps).addTo(map);

                    // Display statistics
                    const statsDiv = document.getElementById('stats');
                    statsDiv.style.display = 'block';
                    let statsHtml = `<strong>Loaded ${parcels.length} parcels</strong><br>`;
                    statsHtml += 'Geocode sources used:<br>';
                    for (const [source, count] of Object.entries(sourceStats)) {
                        statsHtml += `&nbsp;&nbsp;${source}: ${count}<br>`;
                    }
                    statsDiv.innerHTML = statsHtml;

                    console.log(`Loaded ${parcels.length} parcels`);
                    console.log('Source breakdown:', sourceStats);
                })
                .catch(error => {
                    console.error('Error loading parcels:', error);
                    document.getElementById('loading').innerHTML = 'Error loading data';
                    document.getElementById('reload-btn').disabled = false;
                });
        }
    </script>
</body>
</html>
